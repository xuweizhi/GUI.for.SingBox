name: Build GUI.for.SingBox WebUI

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-linux:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        arch: [amd64, arm64]
    env:
      APP_NAME: GUI.for.SingBox
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          check-latest: true
      - uses: pnpm/action-setup@v4
        with:
          version: latest
      - uses: actions/setup-node@v6
        with:
          node-version: "latest"
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: Build WebUI
        env:
          VITE_APP_VERSION: ${{ github.ref_name }}
        run: |
          cd frontend
          pnpm install --frozen-lockfile
          pnpm build
      - name: Build headless service
        env:
          GOOS: linux
          GOARCH: ${{ matrix.arch }}
          CGO_ENABLED: "0"
        run: |
          mkdir -p release/$APP_NAME-linux-${{ matrix.arch }}
          go build -trimpath -ldflags="-s -w -X guiforcores/bridge.AppVersion=${{ github.ref_name }}" -o release/$APP_NAME-linux-${{ matrix.arch }}/$APP_NAME .
          cp build/linux/gui.for.singbox-headless.service release/$APP_NAME-linux-${{ matrix.arch }}/
          cp build/linux/gui.for.singbox-headless.env.example release/$APP_NAME-linux-${{ matrix.arch }}/
          cp README.md LICENSE release/$APP_NAME-linux-${{ matrix.arch }}/
          tar -C release -czf release/$APP_NAME-linux-${{ matrix.arch }}.tar.gz $APP_NAME-linux-${{ matrix.arch }}
      - uses: actions/upload-artifact@v6
        with:
          name: linux-${{ matrix.arch }}
          path: release/*.tar.gz

  release:
    needs: build-linux
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: release-assets
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          files: release-assets/**/*.tar.gz
          draft: false
          prerelease: ${{ contains(github.ref_name, 'dev') }}
          body: Linux headless WebUI release.
